[package]
name = "memo-cli"
version = "0.1.0"
edition = "2021"
description = "Shared agent memory stored in SQLite"
license = "MIT"
repository = "https://github.com/robsonperassoli/memo-cli"
publish = false

[lib]
name = "memo"
path = "src/lib.rs"

[[bin]]
name = "memo"
path = "src/main.rs"

[package.metadata.dist]
dist = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled"] }
serde_json = "1"
sha2 = "0.11.1"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3.27.0"
