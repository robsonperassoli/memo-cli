name: PR description

on:
  pull_request:

permissions:
  pull-requests: write

jobs:
  description:
    runs-on: ubuntu-latest
    steps:
      - name: Set description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR" --repo "${{ github.repository }}" --body-file - << 'EOF'
          ## Summary

          Configure cargo-dist so pushing a `v*` tag builds and publishes a GitHub Release.

          - Targets: Linux, macOS, and Windows on x86_64 and aarch64
          - sha256 checksums for each archive, plus `sha256.sum`
          - Installers: `memo-cli-installer.sh` and `memo-cli-installer.ps1`
          - Short install and release notes in the README and `docs/`

          No release tag was pushed.

          ## Test plan

          - [x] `cargo fmt --check`
          - [x] `cargo clippy -- -D warnings`
          - [x] `cargo test`
          - [x] `dist generate --check`
          - [x] `dist plan` lists the six targets, sha256 checksums, and both installers
          - [x] `dist build` for `x86_64-unknown-linux-gnu` produces an archive whose checksum matches, and `memo --version` prints `memo 0.1.0`
          - [x] `dist build --artifacts=global` writes `memo-cli-installer.sh` and `memo-cli-installer.ps1`
          - [x] Pull request CI (fmt, clippy, test, and `dist plan`)
          EOF
